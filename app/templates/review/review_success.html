<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Event Review Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <main class="success-container">
        <section class="success-card" aria-labelledby="thank-you-title">
            <div class="success-icon" aria-hidden="true">
                <i class="fas fa-check-circle"></i>
            </div>

            <h1 class="success-title" id="thank-you-title">Thank You</h1>
            <p class="success-message">Your review for "{{ event.title }}" has been submitted successfully.</p>
            <p class="success-message">You may now close this tab.</p>
        </section>
    </main>
</body>
</html>
