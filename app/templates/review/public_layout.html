<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} - {% endif %}Event Review Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <div class="ambient-background" aria-hidden="true"><span></span><span></span><span></span></div>

    <header class="header public-header shadow-sm bg-white">
        <nav class="navbar py-2">
            <div class="nav-container d-flex justify-content-between align-items-center">
                <a href="{{ url_for('main.index') }}" class="nav-logo text-decoration-none">
                    <i class="fas fa-star text-primary me-2"></i><span class="fw-bold text-dark fs-5">Event<span class="text-primary">Reviews</span></span>
                </a>
                <div class="public-nav-badge text-muted small">
                    <i class="fas fa-comment-dots text-primary me-1"></i> Attendee Feedback Portal
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button class="alert-close">&times;</button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
