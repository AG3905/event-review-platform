{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header"><h1 class="dashboard-title">Platform Analytics</h1><p class="dashboard-subtitle">A global view across all organizer tenants.</p></div>
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div><h3 class="stat-number">{{ total_organizers }}</h3><p class="stat-label">Organizers</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar"></i></div><div><h3 class="stat-number">{{ total_events }}</h3><p class="stat-label">Events</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-comment"></i></div><div><h3 class="stat-number">{{ total_reviews }}</h3><p class="stat-label">Approved Reviews</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div><h3 class="stat-number">{{ '%.1f'|format(average_rating) }}</h3><p class="stat-label">Average Rating</p></div></div>
    </div>
</div>
{% endblock %}
